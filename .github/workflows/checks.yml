name: Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check report helper syntax
        run: node --check skills/audit-report-authoring/scripts/lint-report-set.mjs
      - name: Test installation sync
        run: python3 scripts/test_sync.py
      - name: Test specialist launcher with fake tools
        run: python3 -B skills/agent-lanes/scripts/test_specialist.py
      - name: Test transcript extraction
        run: python3 -B -m unittest discover -s skills/operator-protocol/scripts
      - name: Test prompts, preparer and verdict scripts
        run: python3 -B -m unittest discover -s skills/pr-ready/scripts
      - name: Prepare every role and lens as the review service does
        run: python3 -B scripts/check_review_staging.py && python3 -B -m unittest discover -s scripts -p 'test_check_review_staging.py'
