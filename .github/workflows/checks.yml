name: Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned documentation tooling
        run: |
          python -m venv .tmp/spec-docs-env
          .tmp/spec-docs-env/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps -r skills/spec-writing/scripts/requirements.lock
          .tmp/spec-docs-env/bin/python -m pip check
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check report helper syntax
        run: node --check skills/audit-report-authoring/scripts/lint-report-set.mjs
      - name: Test installation sync
        run: .tmp/spec-docs-env/bin/python scripts/test_sync.py
      - name: Test transcript extraction
        run: .tmp/spec-docs-env/bin/python -B -m unittest discover -s skills/operator-protocol/scripts
      - name: Prepare every role and lens as the review service does
        run: .tmp/spec-docs-env/bin/python -B scripts/check_review_staging.py && .tmp/spec-docs-env/bin/python -B -m unittest discover -s scripts -p 'test_check_review_staging.py'
